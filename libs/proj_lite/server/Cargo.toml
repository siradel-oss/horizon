[package]
name = "proj_server"
version = "0.1.0"
authors = ["Steven Le Rouzic <slerouzic@siradel.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde_json = "1.0"
rocket = "0.4.2"
regex = "1.1.9"

[dependencies.serde]
version = "1.0.98"
features = ["derive"]

[dependencies.rocket_contrib]
version = "0.4.2"
default-features = false
features = ["json", "redis_pool"]