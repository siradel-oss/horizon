edition = "2026";
package HrzProtocol;
option  optimize_for                  = LITE_RUNTIME;
option  features.field_presence       = IMPLICIT;
option  features.enforce_naming_style = STYLE_LEGACY;

import "hrz/protocol/color/color.proto";
import "hrz/protocol/types/primitive.proto";

message NodataValue {
    reserved 1, 2, 3;

    oneof value_type {
        // Little endian bit pattern.
        uint32 bit_pattern = 4;

        // Color value, for color rasters.
        Color  color       = 5;

        // Unsigned integer value, for integer rasters.
        uint32 uint_value  = 6;

        // Signed integer value, for integer rasters.
        int32  int_value   = 7;

        // Exact float value.
        float  float_value = 8;

        // All NaN values, for float rasters.
        Void   float_nan   = 9;
    }
}

export enum NodataHandling {
    // All pixels are valid.
    IGNORE_NODATA         = 0;

    // Pixels that are nodata are not processed.
    DISCARD_NODATA_PIXELS = 1;

    // All channels of nodata pixels are set to 0.
    SET_NODATA_TO_ZERO    = 2;
}

export message RasterNodata {
    bool        has_nodata = 1;
    // Value of the channels of a pixel that contains no meaningful value.
    NodataValue value      = 2;
}
