edition = "2026";
package HrzProtocol;
option  optimize_for                  = LITE_RUNTIME;
option  features.field_presence       = IMPLICIT;
option  features.enforce_naming_style = STYLE_LEGACY;

import "hrz/protocol/camera/index.proto";
import "hrz/protocol/color/color.proto";
import "hrz/protocol/geo/coords.proto";
import "hrz/protocol/maths/maths.proto";
import "hrz/protocol/lighting_settings.proto";

message TerrainSettings {
    reserved 6;

    // The terrain color applied below the raster.
    // Alpha is ignored.
    Color            terrain_color             = 5;

    // The terrain opacity is applied to both the terrain and the rasters.
    float            terrain_opacity           = 1;

    // Set to true to ignore all DTM layers for this scene view, i.e. force
    // the ground to be at elevation zero.
    //
    // This only affects the terrain itself. Other systems relying on the
    // DTM layers for elevations are unaffected, such as clamping vector
    // features.
    bool             disable_terrain_elevation = 7;

    int32            clip_id                   = 2;

    LightingSettings lighting                  = 4;
}

// Mean solar date and time, within an idealised year.
message SolarDate {
    // Mean solar time, hours, [0, 24).
    // This is clock time rather than sundial time: the Sun crosses the
    // meridian at 12:00, give or take the equation of time (-14 to +16
    // minutes over the year).
    // Where this time applies depends on `at_prime_meridian`.
    float solar_time        = 1;

    // When false, `solar_time` is the local mean solar time at the camera.
    // The Sun does not move as the camera travels along a parallel.
    //
    // When true, `solar_time` is the mean solar time at the prime meridian.
    // The Sun is fixed relative to the Earth; moving the camera changes where
    // it appears in the sky.
    bool  at_prime_meridian = 2;

    // Where the Earth stands on its orbit, expressed either way.
    // When neither is set, the Sun is placed as if `solar_longitude` was 0.
    oneof time_of_year {
        // λ, the true ecliptic longitude of the Sun, degrees, [0, 360),
        // 0 = March equinox.
        // Beware that it does not advance uniformly over the year, since the
        // Earth moves faster around its perihelion. Use `day_of_year` to let
        // the engine take care of this.
        float solar_longitude = 101;

        // Days elapsed since the 1st of January at midnight, so 0 is the 1st
        // of January. Fractional values are valid, and values outside of
        // [0, 365.2422) wrap around.
        //
        // `solar_time` is taken into account on top of this, so that the Sun
        // keeps moving along its orbit while the time of day is animated.
        //
        // The year is idealised: it lasts exactly one mean tropical year
        // (365.2422 days) and the March equinox always falls on day 78.5, the
        // 20th of March at midday. There are no leap years, and precession is
        // ignored, as everywhere else in the Sun computations. Equinoxes and
        // solstices therefore land within an hour of their average date over
        // a leap cycle, and within a few hours of their date in any given
        // year.
        float day_of_year     = 102;
    }
}

// Date and time in a timezone, on the proleptic Gregorian calendar.
// The Sun is fixed relative to the Earth; moving the camera changes where
// it appears in the sky.
//
// This is the only way to give the Sun an actual date, as opposed to a
// position within an idealised year. Leap years are accounted for, and the
// Sun stays within a hundredth of a degree of its real position between
// 1950 and 2050.
message CalendarDate {
    int32 year       = 1;

    // [1, 12]
    int32 month      = 2;

    // [1, 31]
    int32 day        = 3;

    // Time in the timezone, hours, [0, 24).
    // This is civil clock time, which is a mean solar time, so the Sun
    // crosses the meridian of `utc_offset` at 12:00 give or take the
    // equation of time. Leap seconds are ignored.
    float time       = 4;

    // Offset from UTC, hours, [-12, 14].
    // Daylight saving time is the caller's business: this is the offset
    // that applies on that date, not the timezone's standard offset.
    // Examples:
    // * GMT: 0
    // * CET: 1
    // * CEST: 2
    // * IST: 5.5
    // * EST: -5
    float utc_offset = 5;
}

// Fixed direction, given as an azimuth and an altitude in a frame.
// Allows Sun positions that are impossible in the real world.
message AngularDirection {
    // Frames attached to the camera.
    enum Frame {
        // @label="North"
        // The East-North-Up frame at the camera position: azimuth is measured
        // from the direction to the North, altitude from the local horizontal
        // plane.
        // The Sun keeps its place in the sky as the camera moves.
        FRAME_ENU            = 0;

        // @label="Camera heading"
        // A rotated ENU frame at the camera position: azimuth is measured from
        // the camera's forward vector projected onto the local horizontal
        // plane, and altitude from that plane.
        // Where the projection of the forward vector degenerates (camera
        // pointing at the zenith or nadir), the camera's up vector projected
        // onto the same plane is used instead, negated when the camera points
        // upward.
        FRAME_CAMERA_HEADING = 1;

        // @label="Camera"
        // The camera's own basis: azimuth is measured around the camera's up
        // axis from its forward direction, and altitude from the plane its
        // forward and right directions span. The Sun therefore keeps its exact
        // place on screen whatever the camera does.
        // At an azimuth and an altitude of 0 the Sun sits directly ahead.
        FRAME_CAMERA         = 2;
    }

    // The frame both angles below are measured in.
    // When neither is set, the frame is `FRAME_ENU` at the camera.
    oneof reference {
        // A frame attached to the camera.
        Frame              camera_frame        = 101;

        // The East-North-Up frame at a geographic position: azimuth is
        // measured from the direction to the North, altitude from the local
        // horizontal plane.
        // The Sun is fixed relative to the Earth; moving the camera changes
        // where it appears in the sky.
        // The position's altitude is ignored.
        GeographicPosition geographic_position = 102;
    }

    // radians, [0, 2π), clockwise from the frame's origin
    float azimuth  = 1;

    // radians, [-π, π], 0 in the frame's horizontal plane
    float altitude = 2;
}

enum SunLightingMode {
    // @label="Simulated"
    SUN_LIGHTING_SIMULATED = 0;
    // @label="Static"
    SUN_LIGHTING_STATIC    = 1;
}

enum AmbientLightingMode {
    // @label="Simulated"
    AMBIENT_LIGHTING_SIMULATED = 0;
    // @label="Static"
    AMBIENT_LIGHTING_STATIC    = 1;
}

enum SkyMode {
    // @label="Simulated"
    SKY_SIMULATED = 0;
    // @label="Static"
    SKY_STATIC    = 1;
}

enum StaticSkyColorTransitionUnit {
    // @label="Metres"
    STATIC_SKY_COLOR_TRANSITION_UNIT_METERS = 0;
    // @label="Pixels"
    STATIC_SKY_COLOR_TRANSITION_UNIT_PIXELS = 1;
}

message SkySettings {
    SkyMode                      mode                                   = 1;

    // Attenuates the strength of the impact of the sky on the planet when
    // `mode` is `SKY_SIMULATED`. 0 is the default, realistic value. The maximum
    // is 1.
    float                        attenuation                            = 2;

    // Color of the atmosphere used when `mode` is `SKY_STATIC`.
    Color                        static_atmosphere_color                = 3;

    // Color of the outer space used when `mode` is `SKY_STATIC`.
    Color                        static_space_color                     = 4;

    // Distance from the horizon at which the sky color starts transitioning
    // from the atmosphere color to the space color.
    // This is used only when `mode` is `SKY_STATIC`.
    double                       static_color_transition_start_distance = 5;

    // Distance from the horizon at which the sky color finishes transitioning
    // from the atmosphere color to the space color.
    // This is used only when `mode` is `SKY_STATIC`.
    double                       static_color_transition_end_distance   = 6;

    // Unit of the distances for the static sky color transition.
    // This is used only when `mode` is `SKY_STATIC`.
    StaticSkyColorTransitionUnit static_color_transition_distance_unit  = 7;
}

message SunSettings {
    reserved 2;

    SunLightingMode mode = 1;

    oneof           direction {
        SolarDate        solar_date        = 101;
        CalendarDate     calendar_date     = 102;

        // Milliseconds elapsed since the 1st of January 1970 at 00:00 UTC.
        // Use when animating time, as it is a single continuous numerical
        // variable.
        int64            unix_time_ms      = 103;

        AngularDirection angular_direction = 104;
    }

    // Only used when `mode` is `SUN_LIGHTING_STATIC`.
    // Alpha is ignored.
    Color static_color = 3;
}

message AmbientLightingSettings {
    AmbientLightingMode mode         = 1;

    // Only used when `mode` is `AMBIENT_LIGHTING_STATIC`.
    // Alpha is ignored.
    Color               static_color = 2;
}

message FogSettings {
    // The color towards which pixels of the scene are blended.
    Color color          = 1;
    // The speed at which fog reaches its maximal impact.
    // The default value is one, at which it takes about a kilometer through
    // the thickest layer of fog to reach the maximal impact.
    float density        = 2;
    // The distance at which the fog starts impacting the scene.
    // Positions that are closer are completely unaffected by fog.
    float start_distance = 3;
    // The altitude at which the fog starts decreasing in in intensity.
    // The decrease is exponential.
    float falloff_start  = 4;
    // The altitude at which the fog's impact becomes negligible.
    float falloff_end    = 5;
    // Whether the sky should be obscured by fog.
    bool  apply_to_sky   = 6;
}

message AmbientSettings {
    reserved 1, 2, 3, 4, 5, 6, 7, 8, 9, 12;

    // Global lighting settings applied to the whole scene
    LightingSettings        lighting            = 11;

    // Controls the balance between sun lighting and ambient lighting.
    // At 0.0, there is only ambient lighting.
    // At 0.5, there are equal part sun and ambient lighting.
    // At 1.0, there is only sun lighting.
    float                   sun_ambient_balance = 13;

    // Multiplies both sun and ambient lighting applied to the scene.
    // The default value is 1.0.
    float                   lighting_strength   = 14;

    // Controls the intensity at which faces that are not fully exposed to the
    // sun are deprived from its light. At 0, they stop receiving light as soon
    // as they are perpendicular ot the sun direction. At 1, they stop receiving
    // light when they face the opposite direction.
    float                   wrap_lighting       = 15;

    SkySettings             sky                 = 16;
    SunSettings             sun                 = 17;
    AmbientLightingSettings ambient_lighting    = 18;

    FogSettings             primary_fog         = 19;
    FogSettings             secondary_fog       = 20;

    // This color is displayed under the transparent terrain.
    Color                   underground_color   = 10;
}

message HighlightSettings {
    Color selection_color             = 1;
    float selection_outline_alpha     = 2;

    // in logical pixels.
    float selection_outline_size      = 3;

    // This controls how much the highlight is attenuated when behind other
    // objects, between 0 and 1. At 0 the highlight is invisible behind other
    // objects, and at 1 it's fully visible.
    float selection_occlusion_alpha   = 4;

    Color mouse_hover_highlight_color = 5;
}

message ViewportSettings {
    // Viewport size & location, normalized.
    // This is the "full extent" of the camera view, combined with the
    // `fovy` from the camera settings to create the perspective camera.
    // (0, 0) is top-left corner. (1, 1) is bottom-right corner.
    //
    // If multiple viewports overlap, the one for the scene view with the
    // highest index is drawn on top.
    Bbox viewport = 1;

    // Portion of the viewport that is visible.
    // (0, 0) is top-left corner. (1, 1) is bottom-right corner.
    //
    // For instance if the viewport is ((0, 0), (1, 1)) and the scissor is
    // ((0, 0), (0.5, 1)), only the left half of the camera will be visible.
    //
    // If the viewport is ((0, 0), (0.5, 1)) and the scissor is
    // ((0, 0), (1, 1)), the full camera is visible but only on the left half of
    // the screen.
    Bbox scissor  = 2;
}

message ViewshedSettings {
    bool               enable_viewshed              = 1;
    // Whether or not display the wireframe representation of the viewshed.
    bool               enable_wireframe             = 2;
    // If true, draw the wireframe from the position of the viewshed point of
    // view instead of the near plane.
    bool               draw_wireframe_from_position = 12;
    // Position of the point of view of the viewshed.
    GeographicPosition position                     = 3;
    // Horizontal orientation angle of the viewshed in radians.
    float              bearing                      = 4;
    // Vertical orientation angle of the viewshed in radians.
    float              tilt                         = 5;
    // Horizontal field of view in degrees. Must be < 120 degrees for a better
    // quality.
    float              hfov                         = 6;
    // Ratio between width and height of the viewshed viewport.
    float              aspect_ratio                 = 7;
    // Factor applied to max distance to place near plane of the viewshed.
    // Must be greater than 0 and less or equal to 1.
    float              start                        = 8;
    // Max distance of the viewshed in meters.
    // If quality is not good, consider a higher start factor.
    float              max_distance                 = 9;
    Color              visible_color                = 10;
    Color              hidden_color                 = 11;
}

// This contains all settings global to a scene view.
// @path_root="scene_view_settings"
export message SceneViewSettings {
    CameraIndex       camera    = 1;
    TerrainSettings   terrain   = 2;
    AmbientSettings   ambient   = 3;
    HighlightSettings highlight = 4;
    ViewshedSettings  viewshed  = 5;
    ViewportSettings  viewport  = 6;
}
