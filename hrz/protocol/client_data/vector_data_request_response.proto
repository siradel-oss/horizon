syntax = "proto3";
package HrzProtocol;
option  cc_enable_arenas = true;
option  optimize_for     = LITE_RUNTIME;

import "hrz/protocol/client_data/feature.proto";

message VectorDataRequestResponse {
    uint32                 ticket      = 1;
    bool                   error       = 4;
    repeated ClientFeature features    = 2;
    string                 attribution = 3;
}
