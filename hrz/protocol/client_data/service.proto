edition = "2026";
package HrzProtocol;
option  optimize_for                  = LITE_RUNTIME;
option  features.field_presence       = IMPLICIT;
option  features.enforce_naming_style = STYLE_LEGACY;

import "hrz/protocol/client_data/vector_data_request_response.proto";
import "hrz/protocol/client_data/asset_request.proto";
import "hrz/protocol/client_data/vector_data_invalidation.proto";
import "hrz/protocol/types/primitive.proto";

service ClientDataService {
    // Respond to a vector data request with the requested features.
    rpc ProvideVectorData(VectorDataRequestResponse) returns (Void);

    // Signal that the vector data received from a data source is now
    // considered to be invalid.
    // This makes the engine query it again if still needed.
    // Note that this is not limited to client-provided data sources.
    rpc InvalidateVectorData(VectorDataInvalidation) returns (Void);

    // Respond to an asset data request with the data.
    rpc ProvideAssetData(AssetRequestResponse) returns (Void);
}
