edition = "2026";
package        HrzProtocol;
option         optimize_for                  = LITE_RUNTIME;
option         features.field_presence       = IMPLICIT;
option         features.enforce_naming_style = STYLE_LEGACY;

export message Void {}

export message BoolProperty {
    string name          = 1;
    bool   default_value = 2;
}

export message IntProperty {
    string name          = 1;
    int64  default_value = 2;
}

export message FloatProperty {
    string name          = 1;
    float  default_value = 2;
}

export message StringProperty {
    string name          = 1;
    string default_value = 2;
}
