edition = "2026";
package        HrzProtocol;
option         optimize_for                  = LITE_RUNTIME;
option         features.field_presence       = IMPLICIT;
option         features.enforce_naming_style = STYLE_LEGACY;

// Message definitions copied from
// https://github.com/protocolbuffers/protobuf/blob/master/src/google/protobuf/wrappers.proto

// Wrapper message for `double`.
export message DoubleValue {
    // The double value.
    double value = 1;
}

// Wrapper message for `float`.
export message FloatValue {
    // The float value.
    float value = 1;
}

// Wrapper message for `int64`.
export message Int64Value {
    // The int64 value.
    int64 value = 1;
}

// Wrapper message for `uint64`.
export message UInt64Value {
    // The uint64 value.
    uint64 value = 1;
}

// Wrapper message for `int32`.
export message Int32Value {
    // The int32 value.
    int32 value = 1;
}

// Wrapper message for `uint32`.
export message UInt32Value {
    // The uint32 value.
    uint32 value = 1;
}

// Wrapper message for `bool`.
export message BoolValue {
    // The bool value.
    bool value = 1;
}

// Wrapper message for `string`.
export message StringValue {
    // The string value.
    string value = 1;
}

// Wrapper message for `bytes`.
export message BytesValue {
    // The bytes value.
    bytes value = 1;
}
