syntax = "proto3";
package HrzProtocol;
option  cc_enable_arenas = true;
option  optimize_for     = LITE_RUNTIME;

import "hrz/protocol/types.proto";
import "hrz/protocol/scene_model.proto";

message PositionalViewpoint {
    // Position of the camera.
    GeographicPosition position = 1;
    // Targetted position.
    GeographicPosition target   = 2;
}

message AngularViewpoint {
    // Target position of the viewpoint.
    GeographicPosition target   = 1;
    // Rotation in radians of the camera on the plane tangent to the ellipsoid.
    // 0 points to the North. Clockwise.
    float              bearing  = 2;
    // Position on an arc between directly over target and the Earth's surface,
    // in radians.
    float              tilt     = 3;
    // Distance from target position in meters.
    float              distance = 4;
}

message BoundsView {
    // Bounds to be displayed on screen.
    GeographicBounds bounds       = 1;
    // Minimal altitude of the bounds to display.
    double           min_altitude = 2;
    // Maximal altitude of the bounds to display.
    double           max_altitude = 3;
    // Tilt of the camera around the bounds.
    // In radians, 0 is straight down.
    float            tilt         = 4;
}

message Pose {
    // Position of the camera.
    GeographicPosition position = 1;
    // Rotation in radians on the plane tangent to the ellipsoid. 0 points to
    // the North. Clockwise.
    float              bearing  = 2;
    // Angle in radians between the plane tangent to the ellipsoid and the
    // forward vector of the camera.
    float              tilt     = 3;
}

// This enum defines easing function used
// for camera animation.
enum EasingFunctions {
    // Slower at the beginning, faster at the end.
    // @label="Ease-in"
    EASE_IN    = 0;
    // Faster at the beginning, slower at the end.
    // @label="Ease-out"
    EASE_OUT   = 1;
    // Slower at the beginning and the end, faster in between.
    // @label="Ease-in-out"
    EASE_INOUT = 2;
}

enum TrajectoryType {
    // The camera follows a simple interpolated path.
    INTERPOLATED = 0;
    // The camera raises and then goes back down, to better show its travel.
    BALLISTIC    = 1;
}

message CameraAnimationOptions {
    // The duration of the animation in seconds.
    float           duration        = 1;
    // Easing function to specify animation interpolation.
    EasingFunctions easing_function = 2;
    // Easing function exponent to specify function curvature.
    float           easing_exponent = 3;
    // The shape of the trajectory of the movement.
    TrajectoryType  trajectory_type = 4;
}

message FixedTargetCameraTransition {
    oneof view {
        AngularViewpoint    angular_viewpoint    = 101;
        PositionalViewpoint positional_viewpoint = 102;
    }

    CameraIndex            camera_index    = 7;
    double                 min_distance    = 1;
    double                 max_distance    = 2;
    // In radians, 0 is straight down.
    float                  min_tilt        = 3;
    // In radians, 0 is straight down.
    float                  max_tilt        = 4;
    CameraAnimationOptions go_to_animation = 5;
    AltitudeMode           altitude_mode   = 6;
}

message FixedPositionCameraTransition {
    oneof view {
        Void                current              = 101;
        AngularViewpoint    angular_viewpoint    = 102;
        PositionalViewpoint positional_viewpoint = 103;
        Pose                pose                 = 104;
    }

    CameraIndex            camera_index    = 5;

    // In radians, 0 is straight down.
    float                  min_tilt        = 1;
    // In radians, 0 is straight down.
    float                  max_tilt        = 2;
    CameraAnimationOptions go_to_animation = 3;
    AltitudeMode           altitude_mode   = 4;
}

message OrbitCameraTransition {
    oneof view {
        Void                current              = 101;
        AngularViewpoint    angular_viewpoint    = 102;
        PositionalViewpoint positional_viewpoint = 103;
        Pose                pose                 = 104;
        BoundsView          bounds               = 105;
    }

    CameraIndex            camera_index         = 9;

    GeographicBounds       limit_bounds         = 1;
    double                 max_altitude         = 2;
    // In radians, 0 is straight down.
    float                  min_tilt             = 3;
    // In radians, 0 is straight down.
    float                  max_tilt             = 4;
    CameraAnimationOptions go_to_animation      = 5;
    bool                   is_interruptible     = 6;
    AltitudeMode           altitude_mode        = 7;

    // This is the animation that happens when we correct the position of the
    // camera to put is back in the limits defined above.
    // When the duration is 0, the camera is simply limited to the bounds.
    // When the duration is > 0, the camera can move out of the bounds, but is
    // corrected after a few idle seconds using this animation.
    CameraAnimationOptions correction_animation = 8;
}

message CameraIndexReference { CameraIndex camera = 1; }

enum CameraFrame {
    // Aligned with the north-south and earth-west axes.
    // @label="Cardinal"
    CAMERA_FRAME_CARDINAL   = 0;

    // Aligned with forward-backward and left-right axes of the camera,
    // tangential to the terrain.
    // @label="Tangential"
    CAMERA_FRAME_TANGENTIAL = 1;
}

// The translation distance is defined as the geodesic distance between two
// points some fixed central angle appart.
// The factor here is applied to modify the central angle between the two
// points.
// The default central angle is chosen so that a factor of -1/1 produces a
// movement that is more or less what is naïvely expected.
// The distance computed is applied per second when using a continuous movement.
message CameraTranslate {
    reserved 1, 2;

    CameraFrame frame          = 3;

    // For cardinal frame, < 0 = west, > 0 = east.
    // For tangential frame, < 0 = left, > 0 = right.
    float       angle_factor_x = 4;

    // For cardinal frame, < 0 = south, > 0 = north.
    // For tangential frame, < 0 = backward, > 0 = forward.
    float       angle_factor_y = 5;
}

message CameraRotate {
    // In radians (in rad/s when using continuous movement). Clockwise.
    float bearing = 1;
    float tilt    = 2;
}

message CameraZoom {
    // Ratio of 2 means a 2x zoom toward the planet (ratio is applied per
    // second when using a continuous movement).
    float ratio = 1;
}

enum CameraContinuousMovementInterruption {
    // Continuous movement cannot be interrupted except by a transition or
    // another continuous movement.
    // @label="Not interruptible"
    CONTINUOUS_MOVEMENT_NOT_INTERRUPTIBLE         = 0;

    // Continuous movement can be interrupted by user actions.
    // @label="Interruptible"
    CONTINUOUS_MOVEMENT_INTERRUPTIBLE_NO_RESUME   = 1;

    // Continuous movement can be interrupted by user actions, and when said
    // action is over, the movement resumes.
    // @label="Interruptible, then resumes"
    CONTINUOUS_MOVEMENT_INTERRUPTIBLE_THEN_RESUME = 2;
}

message CameraMovement {
    reserved 2, 3;

    CameraIndex                          camera_index                     = 1;

    // For continuous movements only. Sets whether the movement can be
    // interrupted, and whether it can resume after it has been interrupted.
    CameraContinuousMovementInterruption continuous_movement_interruption = 4;

    oneof                                movement {
        CameraTranslate translation = 101;
        CameraRotate    rotation    = 102;
        CameraZoom      zoom        = 103;
    }
}

enum CameraMovementType {
    CAMERA_TRANSLATION = 0;
    CAMERA_ROTATION    = 1;
    CAMERA_ZOOM        = 2;
}

message CameraNotification {
    CameraIndex camera_index = 1;

    oneof       kind {
        Void               animation_started           = 101;
        Void               animation_ended             = 102;
        Void               animation_interrupted       = 103;

        CameraMovementType continuous_movement_started = 104;
        CameraMovementType continuous_movement_interrupted_no_resume = 105;
        CameraMovementType continuous_movement_interrupted_will_resume = 106;
        CameraMovementType continuous_movement_resumed = 107;
        CameraMovementType continuous_movement_ended   = 108;

        // Sent when the camera starts moving after a few frames of inactivity.
        // Any kind of movement can trigger this event.
        Void               motion_started              = 109;

        // Sent after a few frames without any camera motion.
        Void               motion_ended                = 110;
    }
}

message SceneViewReference { SceneViewIndex scene_view = 1; }

message GeographicPositionInSceneView {
    SceneViewIndex     scene_view = 1;
    GeographicPosition pos        = 2;
}

message ResetNorthParams {
    reserved 4;

    CameraIndex            camera_index      = 1;
    bool                   reset_tilt        = 2;
    CameraAnimationOptions animation_options = 3;
}

message ViewScaleAltitude {
    // Approximate size of one meter in logical pixels.
    // This takes into account the terrain, and guesses that the
    // focal point of the view is more or less at its center.
    // Zero if currently unknown.
    double one_meter_size_in_pixels     = 1;

    // Altitude in meters of the camera relative to the WGS84 ellipsoid.
    double altitude_absolute            = 2;

    // Altitude in meters of the camera relative to the terrain.
    double altitude_relative_to_terrain = 3;
}

// @service_id=0x3b1436d9
service CameraService {
    // Moves the camera to a new position and set its mode to fixed target.
    //
    // @method_id=0x83c9f8f5
    rpc SetFixedTarget(FixedTargetCameraTransition) returns (Void);

    // Moves the camera to a new position and set its mode to fixed position.
    //
    // @method_id=0x86290280
    rpc SetFixedPosition(FixedPositionCameraTransition) returns (Void);

    // Moves the camera to a new position and set its mode to orbit.
    //
    // @method_id=0x45949e2c
    rpc SetOrbit(OrbitCameraTransition) returns (Void);

    // Retrieves camera pose (position and orientation).
    //
    // @method_id=0x38ae5497
    rpc GetCameraPose(CameraIndexReference) returns (Pose);

    // Retrieves camera angular viewpoint (target position, angles & distance).
    //
    // @method_id=0xc4a07b7f
    rpc GetCameraAngularViewpoint(CameraIndexReference)
        returns (AngularViewpoint);

    // Retrieves camera positional viewpoint (camera position + target
    // position).
    //
    // @method_id=0x9c8b0fae
    rpc GetCameraPositionalViewpoint(CameraIndexReference)
        returns (PositionalViewpoint);

    // Retrieves view box on the WGS84 ellipsoid for a given scene view.
    //
    // @method_id=0x110e3a14
    rpc GetSceneViewViewBox(SceneViewReference) returns (GeographicBounds);

    // Retrieves view polygon on the WGS84 ellipsoid for a given scene view.
    //
    // @method_id=0x110e3a15
    rpc GetSceneViewViewPolygon(SceneViewReference)
        returns (GeographicViewPolygon);

    // Retrieves the latest scale and altitude of a specific scene view.
    // See the returned messages's documentation for more information.
    //
    // @method_id=0x36db9edd
    rpc GetSceneViewScaleAndAltitude(SceneViewReference)
        returns (ViewScaleAltitude);

    // Retrieves view box on the WGS84 ellipsoid for a given camera.
    // The viewports of all associated scene views are merged.
    //
    // @method_id=0x110e3a16
    rpc GetCameraViewBox(CameraIndexReference) returns (GeographicBounds);

    // Retrieves view polygon on the WGS84 ellipsoid for a given camera.
    // The viewports of all associated scene views are merged.
    //
    // @method_id=0x110e3a17
    rpc GetCameraViewPolygon(CameraIndexReference)
        returns (GeographicViewPolygon);

    // Converts lat/lon/alt coordinates into pixel coordinates.
    // Performs a basic projection into screen space.
    // The output coordinates are given in the entire canvas viewport.
    //
    // @method_id=0xff9c32a0
    rpc LatLonAltToPixelCoords(GeographicPositionInSceneView)
        returns (PixelPositionResult);

    // @method_id=0x0cefee73
    rpc Move(CameraMovement) returns (Void);

    // @method_id=0xe97e55fd
    rpc BeginContinuousMovement(CameraMovement) returns (Void);

    // @method_id=0x170dec9e
    rpc EndContinuousMovement(CameraMovement) returns (Void);

    // Resets the camera bearing so that the north is up. The camera tilt can
    // also be reset at the same time. This action can be bound to a key. See
    // `HrzProtocol.KeyInteractionBindings`.
    //
    // @method_id=0x6ef233dd
    rpc ResetNorth(ResetNorthParams) returns (Void);
}
