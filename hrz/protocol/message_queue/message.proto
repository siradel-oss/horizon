edition = "2026";
package HrzProtocol;
option  optimize_for                  = LITE_RUNTIME;
option  features.field_presence       = IMPLICIT;
option  features.enforce_naming_style = STYLE_LEGACY;

import "hrz/protocol/attribution/message.proto";
import "hrz/protocol/image.proto";
import "hrz/protocol/types/primitive.proto";
import "hrz/protocol/camera/notification.proto";
import "hrz/protocol/identification/object_reference.proto";
import "hrz/protocol/identification/picking_ticket.proto";
import "hrz/protocol/identification/picking_result.proto";
import "hrz/protocol/identification/raster_data_fetch_ticket.proto";
import "hrz/protocol/mapbox/result.proto";
import "hrz/protocol/client_data/asset_request.proto";
import "hrz/protocol/monitoring/message.proto";
import "hrz/protocol/identification/mouse_hover.proto";
import "hrz/protocol/gizmo/message.proto";
import "hrz/protocol/shape_editor/message.proto";
import "hrz/protocol/client_data/vector_data_request_message.proto";

message PickResultMessage {
    PickTicket  ticket  = 1;
    PickResults results = 2;
}

message PickAreaResultMessage {
    PickAreaTicket                ticket = 1;
    repeated TypedObjectReference refs   = 2;
}

message RasterDataFetchMessage {
    RasterDataFetchTicket    ticket  = 1;
    repeated PickLayerResult results = 2;
}

message ViewerLoadingProgressMessage {
    uint32 completed_step_count = 1;
    uint32 total_step_count     = 2;
}

export message TypedMessage {
    oneof payload {
        PickResultMessage            pick                    = 102;
        VectorDataRequestMessage     vector_data_request     = 103;
        MouseHoverInfoMessage        mouse_hover_info        = 104;
        PickAreaResultMessage        pick_area               = 105;
        GizmoUpdateMessage           gizmo_update            = 106;
        ShapeEditorMessage           shape_editor_update     = 107;
        RasterDataFetchMessage       raster_data_fetch       = 108;
        Image                        frame_capture           = 109;
        Void                         viewer_ready            = 110;
        ViewerLoadingProgressMessage viewer_loading_progress = 111;
        MonitoringDataMessage        monitoring_data         = 112;
        AssetRequestMessage          asset_request           = 113;
        MapboxTranslationMessage     mapbox_translation      = 114;
        AttributionsMessage          attributions            = 115;
        CameraNotification           camera_notification     = 116;
    }
}
