edition = "2026";
package        HrzProtocol;
option         optimize_for                  = LITE_RUNTIME;
option         features.field_presence       = IMPLICIT;
option         features.enforce_naming_style = STYLE_LEGACY;

// Colour in sRGB space, with alpha.
// All components are in [0, 1] range.
// Red, green, and blue are gamma corrected, they are non-linear.
// Alpha is linear.
//
// @path_leaf="true"
export message Color {
    float r = 1;
    float g = 2;
    float b = 3;
    float a = 4;
}

export message ColorProperty {
    string name          = 1;
    Color  default_value = 2;
}

// See https://en.wikipedia.org/wiki/Blend_modes
export enum BlendMode {
    // No color blending.
    BLEND_NORMAL   = 0;

    // Applies the source to the hightones of the destination.
    BLEND_MULTIPLY = 1;

    // Applies the source to the lowtones of the destination.
    BLEND_SCREEN   = 2;

    // Applied the source to the midtones of the destination.
    BLEND_OVERLAY  = 3;
}
